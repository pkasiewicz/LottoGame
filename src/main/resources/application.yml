spring:
  application:
    name: LottoGame
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lotto_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      enabled: true

lotto:
  number-generator:
    count: 6
    lowerBand: 1
    upperBand: 99
    api:
      url: ${NUMBER_GENERATOR_API_URL:https://www.randomnumberapi.com/api/v1.0/random}
    scheduler:
      cron: 0 55 11 ? * SAT
  number-receiver:
    count: 6
    lower-band: 1
    upper-band: 99
  result-checker:
    scheduler:
      cron: 0 0 12 ? * SAT

server:
  port: 8084